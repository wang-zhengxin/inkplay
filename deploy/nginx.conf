user nginx;
worker_processes auto;
pid /run/inkplay/nginx.pid;
error_log /var/log/inkplay/error.log warn;

events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/inkplay/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types application/javascript text/javascript text/css application/json;

    server {
        listen 172.22.1.100:80;
        server_name 172.22.1.100;
        root /opt/inkplay/current;
        index index.html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ \.ttf$ {
            types { font/ttf ttf; }
            expires 7d;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
